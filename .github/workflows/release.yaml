name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: zulu

      # The runner image already has the Android SDK, Gradle pulls the NDK and CMake on demand
      - name: Accept Android SDK licenses
        run: (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Set up signing
        env:
          WIDEMELON_KEYSTORE: ${{ secrets.WIDEMELON_KEYSTORE }}
          WIDEMELON_KEYSTORE_PASSWORD: ${{ secrets.WIDEMELON_KEYSTORE_PASSWORD }}
        run: |
          echo "$WIDEMELON_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "MELONDS_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "MELONDS_KEYSTORE_PASSWORD=$WIDEMELON_KEYSTORE_PASSWORD"
            echo "MELONDS_KEY_ALIAS=widemelon"
            echo "MELONDS_KEY_PASSWORD=$WIDEMELON_KEYSTORE_PASSWORD"
          } >> local.properties

      - name: Build release APK
        run: |
          ./gradlew :app:assembleGitHubProdRelease
          cp app/build/outputs/apk/gitHubProd/release/app-gitHub-prod-release.apk "widemelon-${GITHUB_REF_NAME}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: widemelon-${{ github.ref_name }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: widemelon-release
          path: |
            widemelon-${{ github.ref_name }}.apk
            app/build/outputs/mapping/gitHubProdRelease/mapping.txt
            app/build/outputs/native-debug-symbols/gitHubProdRelease/native-debug-symbols.zip
